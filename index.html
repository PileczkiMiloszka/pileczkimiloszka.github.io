<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pilkimiloszka</title>
    <link rel="icon" type="image/png" href="obraz_2026-07-23_220237283.png">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffb6c1, #87cefa);
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        /* Pasek nawigacyjny */
        nav {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        nav a:hover {
            color: gold;
        }

        header {
            background: rgba(0,0,0,0.25);
            padding: 30px;
        }

        h1 {
            font-size: 3em;
            margin: 0;
        }

        p {
            font-size: 1.2em;
        }

        .balls {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 40px 20px;
        }

        .ball {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle at top, #ffffff, #ff69b4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s, background 0.3s;
            cursor: pointer;
            user-select: none;
        }

        .ball:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .ball:active {
            transform: scale(0.95);
        }

        /* Sekcja z przyciskiem i licznikiem */
        .interactive-zone {
            margin: 30px 0;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: gold;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: orange;
        }

        button:active {
            transform: scale(0.95);
        }

        #click-count {
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 15px;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

<!-- Nowość: Menu górne -->
<nav>
    <a href="#">Strona Główna</a>
    <a href="#pilki">Piłeczki</a>
    <a href="#licznik">Licznik</a>
</nav>

<header>
    <h1>⚽ pilkimiloszka ⚽</h1>
    <p>Witamy na stronie "Słodkie Piłeczki Miłoszka"!</p>
</header>

<!-- Klikalne piłeczki -->
<section class="balls" id="pilki">
    <div class="ball" onclick="zmienKolor(this)">
        Kliknij mnie! 🍓
    </div>

    <div class="ball" onclick="zmienKolor(this)">
        Słodkie Piłeczki Miłoszka ⚽
    </div>

    <div class="ball" onclick="zmienKolor(this)">
        Kliknij mnie! 🍬
    </div>
</section>

<!-- Nowość: Interaktywny przycisk z licznikiem -->
<div class="interactive-zone" id="licznik">
    <button onclick="dodajPunkt()">Kliknij mnie!</button>
    <div id="click-count">Liczba kliknięć: 0</div>
</div>

<footer>
    © 2026 pilkimiloszka — Wszystkie prawa zastrzeżone.
</footer>

<!-- Skrypt JavaScript dodający interakcję -->
<script>
    let count = 0;

    function dodajPunkt() {
        count++;
        document.getElementById("click-count").innerText = "Liczba kliknięć: " + count;
    }

    // Funkcja zmieniająca losowo kolor piłeczki po kliknięciu
    function zmienKolor(element) {
        const kolory = [
            'radial-gradient(circle at top, #ffffff, #ff1493)',
            'radial-gradient(circle at top, #ffffff, #00bfff)',
            'radial-gradient(circle at top, #ffffff, #32cd32)',
            'radial-gradient(circle at top, #ffffff, #ff8c00)'
        ];
        const losowyKolor = kolory[Math.floor(Math.random() * kolory.length)];
        element.style.background = losowyKolor;
    }
</script>

</body>
</html>
